  <section class="st-account-grid st-account-single">
    <article class="st-account-card st-auth-card">
      
      <h2>회원가입</h2>
      <form id="signupForm">
        <div class="st-choice-group">
          <label for="signupName">아이디</label>
          <input id="signupName" name="nickname" type="text" placeholder="사용할 아이디를 입력하세요" autocomplete="nickname" required>
        </div>
        <div class="st-choice-group">
          <label for="signupPassword">비밀번호</label>
          <input id="signupPassword" name="password" type="password" placeholder="사용할 비밀번호를 입력하세요" autocomplete="new-password" required>
        </div>
        <div class="st-choice-group">
          <label for="signupEmail">이메일</label>
          <input id="signupEmail" name="email" type="email" placeholder="example@email.com" autocomplete="email" required>
        </div>
        <button class="st-primary-button" type="submit">회원가입</button>
      </form>
      <p class="st-auth-switch">이미 회원이신가요? <a href="11_노래트송_account.html">로그인하기</a></p>
